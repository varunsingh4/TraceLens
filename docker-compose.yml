services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tracelens
      POSTGRES_PASSWORD: tracelens
      POSTGRES_DB: tracelens
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracelens -d tracelens"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
